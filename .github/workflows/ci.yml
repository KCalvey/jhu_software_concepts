name: Module 5 CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: module3_db
          POSTGRES_USER: karicalvey
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: module3_db
      DB_USER: karicalvey
      DB_PASSWORD: test_password
      DATABASE_URL: postgresql+psycopg://karicalvey:test_password@localhost:5432/module3_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install dependencies
        working-directory: module_5
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint
        working-directory: module_5
        run: pylint src/*.py --fail-under=10

      - name: Run Pytest
        working-directory: module_5
        run: pytest

      - name: Generate dependency graph
        working-directory: module_5
        run: |
          pydeps src --noshow -o dependency.svg
          test -f dependency.svg

      - name: Run Snyk dependency scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --file=module_5/requirements.txt
